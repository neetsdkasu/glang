<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>glang</title>
        <link rel="stylesheet" href="./glang/styles.css" />
        <script type="importmap">
            {
                "imports": {
                    "charreader": "./glang/charreader.js",
                    "code": "./glang/code.js",
                    "logger": "./glang/logger.js",
                    "parser": "./glang/parser.js",
                    "rqueue": "./glang/rqueue.js",
                    "scanner": "./glang/scanner.js",
                    "utils": "./glang/utils.js"
                }
            }
        </script>
        <script type="module" src="./glang/script.js" defer></script>
    </head>
    <body>
        <header>
            <h4>glang</h4>
        </header>
        
        <hr />

        <main>
            <div>
                <canvas id="canvas" width="640" height="480"></canvas>
            </div>

            <div>
                <div>
                    <button id="stop" type="stop">STOP</button>
                    <button id="run" type="button">RUN</button>
                </div>
                <details>
                    <summary>code</summary>
                    <textarea id="code" cols="100" rows="40">
dim field_XY(10,10) as integer
sub main()
    let x = -1 + 2 * 3 \ 4 - (5 + 6) * 7 % 8 + 0xFF + 0b111
    let y = x + cint(floor(cfloat(x) * 3.5)) * min(x*10, 10-x) + field_XY(3, x+10) + field_XY.size(1)
    let z = 1.0 - 0.5 / 1.25 * 3.14 - (-1.3).sign()
    let s = "abcd" + fizzbuzz(abs(y * x - 55)+1) + cstr(3.5 + z) + cstr(true) + 5.fizzbuzz() + ""
    x = x + 1 + sel(x > 4, 10, 20)
    y += 100 + x
    z *= 1.5 * z
    s += "abcd" + s
    x = 0
    y = 0
    field_XY(0, 0) = 10
    for let i = 0 to 5 step 1
        if i % 2 = 0 then
            x += 1
        else
            y += 1
        end if
        call add(x, y, 1)
    end for
    let s = fizzbuzz(18)
    print "abcd", x+y, field_XY(2,2), s
    let p = 0
    do while p &lt; 10
        p += 1
    end do
end sub
sub add(x as integer, y as integer, v as integer)
    field_XY(x, y) += v
end sub
func fizzbuzz(n as integer) as string
    if n % 15 = 0 then
        return "FizzBuzz"
    else if n % 5 = 0 then
        return "Buzz"
    else if n % 3 = 0 then
        return "Fizz"
    else
        return cstr(n)
    end if
end func
                    </textarea>
                </details>
            </div>

        </main>
        
        <hr />
        
        <footer></footer>
    </body>
</html>

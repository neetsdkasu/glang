<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>glang</title>
        <link rel="stylesheet" href="./glang/styles.css" />
        <script type="importmap">
            {
                "imports": {
                    "charreader": "./glang/charreader.js",
                    "command": "./glang/command.js",
                    "compiler": "./glang/compiler.js",
                    "code": "./glang/code.js",
                    "logger": "./glang/logger.js",
                    "parser": "./glang/parser.js",
                    "rqueue": "./glang/rqueue.js",
                    "runner": "./glang/runner.js",
                    "scanner": "./glang/scanner.js",
                    "utils": "./glang/utils.js"
                }
            }
        </script>
        <script type="module" src="./glang/script.js" defer></script>
    </head>
    <body>
        <header>
            <h4>glang</h4>
        </header>
        
        <hr />

        <main>
            <div>
                <canvas id="canvas" width="640" height="480"></canvas>
            </div>

            <div>
                <div>
                    <button id="stop" type="stop" disabled>STOP</button>
                    <button id="run" type="button">RUN</button>
                    <label>stepsize: 
                        <input id="step" type="number" min="1" max="100000" value="10000" />
                    </label>
                    <span>status:
                        <span id="status" class="status">...</span>
                    </span>
                </div>
                <details class="srcholder">
                    <summary>source code</summary>
                    <textarea id="code" cols="100" rows="40">' FizzBuzz
Func FizzBuzz(i As Integer) As String
    If i % 15 == 0 Then
        Return "FizzBuzz"
    Else If i % 5 == 0 Then
        Return "Buzz"
    Else If i % 3 == 0 Then
        Return "Fizz"
    Else
        Return cstr(i)
    End If
End Func
Sub Main()
    For let i = 1 To 1000
        Print i, "-&gt;", FizzBuzz(i)
    End For
End Sub
</textarea>
                </details>
            </div>

            <hr />

            <details class="errcatch">
                <summary><span class="cerr">err</span><span class="cin">,in</span><span class="cout">,out</span></summary>
                <div class="indent con cerr">
                    <details class="errcatch">
                        <summary>err</summary>
                        <textarea id="cerr" cols="80" rows="20" readonly></textarea>
                    </details>
                </div>
                <div class="indent con cin">
                    <details>
                        <summary>in</summary>
                        <textarea id="cin" cols="80" rows="20"></textarea>
                    </details>
                </div>
                <div class="indent con cout">
                    <details>
                        <summary>out</summary>
                        <textarea id="cout" cols="80" rows="20" readonly></textarea>
                    </details>
                </div>
            </details>

        </main>
        
        <hr />
        
        <footer></footer>
    </body>
</html>
